# Phoenix canonical semantic model for the bundled Contoso fixture.
#
# Schema:    packages/semantic-layer/src/schema.ts (CanonicalSemanticModelSchema)
# Provenance: hand-authored 2026-05-28 against F-016 plumbing; populates the
#             ont_*/alg_* tables via @phoenix/ontology compileSemanticModel
#             at bootstrap. The first real consumer of the semantic-layer
#             plumbing. See project-delivery/features/022-contoso-semantic-demo.
#
# Numbers in metric.expr verified against the seeded contoso.* schema.
# Note: NetPrice and UnitCost are PER-UNIT amounts (not line totals), so
# revenue/cogs expressions carry an explicit * Quantity factor. ExchangeRate is
# native-per-USD (e.g. GBP≈0.69, AUD≈1.37, USD=1.0), so USD conversion DIVIDES
# by it: USD = native / ExchangeRate. (F-025 G20 corrected this — the metric
# exprs previously multiplied, which inverted FX for non-USD currencies and
# made per-currency/per-region USD breakdowns wrong; the ground-truth figures
# below supersede brainstorm §1.2, which used the pre-fix multiply.)

schemaVersion: 1
sourceId: contoso
generatedAt: '2026-05-28T00:00:00.000Z'

source:
  displayName: Contoso
  domain: retail
  owner: Vizlake
  description: |
    Contoso is a fictional global retailer selling consumer electronics, home
    appliances, and accessories. ~94k orders across 9.6 years (2016-05 →
    2025-12), five trading currencies (USD/EUR/CAD/GBP/AUD), 8 product
    categories, ~2.5k SKUs, 73 stores in 8 countries plus an Online store.
    All transactional amounts are in the order's native currency; the
    `revenue_usd` and `cogs_usd` metrics convert to USD automatically via the
    `ExchangeRate` column on each sale.
  audience: |
    Sales analysts, regional managers, category buyers, and finance reviewers.
    Questions tend to be about revenue, units, margin, store and customer
    breakdowns, and time-over-time trends.
  conventions:
    reportingCurrency: USD
    # F-024 — April–March fiscal year (a common retail/government convention):
    # FY2024 = Apr 2023 → Mar 2024, named by the calendar year it ENDS in. The
    # derived fiscal-grain dims (date.fiscal_year / date.fiscal_quarter) encode
    # the matching +9-month shift (12 − (startMonth−1) = 12 − 3 = 9).
    fiscalYearStart: 04-01
    timezone: UTC
    dataAsOf: '2025-12-31'
    # F-024 — the canonical time axis. The compiler truncates THIS column for
    # `timeGrain` queries (and derived-grain dims reference it), instead of
    # guessing a fact's order-date column. Contoso has a dedicated date entity
    # joined via sale.order_date = date.date.
    primaryDateProperty: date.date
    # ISO weeks start Monday (DuckDB's default); declared for the derived
    # week-grain dimension + future relative-time `*_week` ops.
    weekStart: monday
    # F-024 — the DEFAULT time dimensions for unqualified period questions
    # ("by quarter", "this year", YoY). Contoso runs an April fiscal year, so
    # the business reports on FISCAL periods by default; the digest surfaces
    # this as an explicit directive (the single source of truth — dim names
    # stay descriptive). Calendar grains (date.year / date.calendar_quarter /
    # date.half_year) remain queryable when the user asks for "calendar".
    defaultPeriodDimensions:
      - date.fiscal_year
      - date.fiscal_quarter
      - date.fiscal_half_year
  glossary:
    - term: active customer
      definition: A customer with one or more orders within the answer's time window.
    - term: online store
      definition: |
        A single virtual store row (`store.StoreKey = 999999`,
        `store.Channel = 'Online'`) representing all e-commerce sales — not a
        physical location. Use the `store.channel` dim to split online vs in-store.
    - term: native currency
      definition: |
        The currency the order was transacted in, recorded on each sale row
        as `sale.CurrencyCode`. Use `revenue_usd` (not `revenue_native`) when
        comparing across regions.
    - term: region / market
      definition: |
        Geographic grouping. "Region" → `customer.continent` (Australia,
        Europe, North America) or `store.country_name`; "market" / "country"
        → `customer.country_full`.
        Pick the customer geo for buyer-side questions, store geo for
        location-side.
    - term: fiscal year
      definition: |
        April to March, named by the calendar year it ends in: FY2024 runs
        April 2023 to March 2024, and FY2024-Q1 is April to June 2023.
    - term: product code
      definition: |
        Seven digits, stored with no spaces or hyphens (`0303011`), and read
        out digit by digit: a code heard as "0303 011" is 0303011.
  examples:
    - prompt: What was revenue last quarter?
      description: USD-converted revenue for the most recent quarter in the data.
      tags: [revenue, time]
    - prompt: Top 10 customers by total spend
      description: Ranked by their lifetime USD-converted revenue.
      tags: [customers, ranking]
    - prompt: Best-selling product categories this year
      description: Categories ordered by units sold and USD-revenue this year.
      tags: [products, ranking]
    - prompt: How does our gross margin compare year-over-year?
      description: Gross margin % per year, USD-normalised.
      tags: [margin, time]

ontology:
  entities:
    - id: sale
      name: Sale
      displayName: Sale
      grain: 'One row per order line: an order (OrderKey) and its line number (LineNumber).'
      labelExpr: OrderKey::VARCHAR || '-' || LineNumber::VARCHAR
      description: |
        A single sold line-item — one product, one customer, one store, on
        one day, in one currency. The canonical fact table. Use this for
        any revenue, units, COGS, or margin question. NEVER aggregate
        `NetPrice` or `UnitCost` directly across currencies — use the
        `revenue_usd` / `cogs_usd` metrics which include the FX conversion.
      synonyms: [line item, transaction]
      schemaVersion: 1
    - id: order
      name: Order
      displayName: Order
      grain: 'One row per order (OrderKey).'
      labelExpr: OrderKey::VARCHAR
      description: |
        An order header — one row per OrderKey. Each order has one customer,
        one store, one order date, and may contain multiple sale rows
        (line items). Use this entity ONLY for order-level counts
        ("how many orders were placed last week"). For revenue, units,
        or margin, use `sale`.
      schemaVersion: 1
    - id: customer
      name: Customer
      displayName: Customer
      grain: 'One row per customer (CustomerKey).'
      description: |
        A retail buyer with demographics, geography, and an activity period
        (StartDT, EndDT). There is one row per customer, and every order falls
        within the customer's activity period.

        Per-record / per-named-customer queries route to query_sql
        (per-customer is intentionally NOT exposed as a query_metric
        dimension — see algebra.dimensions comment).

        SQL conventions when joining sales → customer:
        - Columns are PascalCase: `GivenName`, `Surname`, `CountryFull`,
          `City`, `CustomerKey`, `StartDT`, `EndDT`.
        - Join key: `sale.CustomerKey = customer.CustomerKey`.
        - One row per customer, so the join never duplicates sales rows.
          Filter on `customer.EndDT` only when the question asks for customers
          whose activity period is still open (an EndDT after the data's as-of
          date). An active customer is one with orders in the answer's time
          window (see the glossary), which is not the same thing.
        - Display name: `customer.GivenName || ' ' || customer.Surname AS name`.
        - Total spend in USD: `SUM(sale.NetPrice * sale.Quantity / sale.ExchangeRate)`.
          NetPrice is per-unit (× Quantity for the line total) and in the row's
          native currency; ExchangeRate is native-per-USD, so DIVIDE to get USD.
          Never `SUM(sale.NetPrice)` alone — Contoso transacts in 5 currencies
          (USD/EUR/CAD/GBP/AUD) and the column is per-unit native amount.

        Worked example — top 10 by spend:
          SELECT
            c.GivenName || ' ' || c.Surname AS name,
            c.CountryFull,
            ROUND(SUM(s.NetPrice * s.Quantity / s.ExchangeRate), 0) AS total_spend_usd
          FROM contoso.sales s
          JOIN contoso.customer c USING (CustomerKey)
          GROUP BY 1, 2
          ORDER BY total_spend_usd DESC
          LIMIT 10
      synonyms: [client, buyer, shopper]
      # F-025 — display label expression. Real columns are GivenName/Surname
      # (PascalCase), NOT the FirstName/LastName an LLM tends to guess. Surfaced
      # in the always-on digest so raw query_sql SELECTs the right columns first try.
      labelExpr: GivenName || ' ' || Surname
      schemaVersion: 1
    - id: product
      name: Product
      displayName: Product
      grain: 'One row per product (ProductKey).'
      description: |
        A SKU with cost, list price, brand, manufacturer, and a four-level
        category hierarchy (Category → SubCategory → Brand → Product).
        ~2,517 active SKUs across 8 categories.
      synonyms: [item, SKU]
      schemaVersion: 1
    - id: store
      name: Store
      displayName: Store
      grain: 'One row per store (StoreKey), the single Online store included.'
      description: |
        A physical retail location or the single Online virtual store. A
        current store is one with no CloseDate (`CloseDate IS NULL`):
        `Status` is NULL for open stores, so `Status != 'Closed'` drops every
        one of them. 64 of 74 stores have at least one sale in the data window.

        The Online virtual store has `StoreKey=999999`, `CountryName='Online'`,
        and is tagged `Channel='Online'`; every physical location is
        `Channel='In-store'`. Use the `store.channel` dim to split revenue
        online-vs-physical — do NOT group by `store.status` (NULL for open
        stores, 'Closed' or 'Restructured' otherwise; unrelated to the channel
        question).
      synonyms: [branch, location, outlet]
      schemaVersion: 1
    - id: date
      name: Date
      displayName: Date
      grain: 'One row per calendar day, 2016-01-01 to 2026-12-31.'
      description: |
        Conformed calendar table covering 2016-01-01 → 2026-12-31 (11 years).
        Always join through this entity for time intelligence: `Date`,
        `YearMonth`, `YearQuarter` and `Year` are its calendar grains, while
        `Quarter` and `Month` name a period without its year.
      schemaVersion: 1
    - id: currency_rate
      name: Currency rate
      displayName: Currency rate
      grain: 'One row per day and currency pair (Date, FromCurrency, ToCurrency).'
      description: |
        Daily FX rates between every transactional currency pair. The
        `revenue_usd` metric reads `sale.ExchangeRate` directly off the
        sale row (pre-joined at order time); this entity is exposed for
        independent FX questions.
      schemaVersion: 1

  properties:
    # sale (13 cols — fact table, all annotated)
    - { id: sale.order_key,     entityId: sale, name: OrderKey,     dtype: int,       nullable: false, role: foreign_key,
        description: 'Foreign key to the order header. Multiple sale rows share an OrderKey when the order has multiple line items.',
        lineage: { sourceTable: sales, sourceColumn: OrderKey }, schemaVersion: 1 }
    - { id: sale.line_number,   entityId: sale, name: LineNumber,   dtype: int,       nullable: false, role: attribute,
        description: 'The line''s number in its order, from 0 (0 to 6). 1,448 orders skip a number, so count an order''s lines rather than reading the count from the highest number. With OrderKey it names one sale row.',
        lineage: { sourceTable: sales, sourceColumn: LineNumber }, schemaVersion: 1 }
    - { id: sale.order_date,    entityId: sale, name: OrderDate,    dtype: date,      nullable: false, role: foreign_key,
        description: 'The date the order was placed. Joins to date.Date for time intelligence.',
        lineage: { sourceTable: sales, sourceColumn: OrderDate }, schemaVersion: 1 }
    - { id: sale.delivery_date, entityId: sale, name: DeliveryDate, dtype: date,      nullable: true,  role: attribute,
        description: 'The day the line was delivered: the order date or later, never earlier. Time series follow the order date; group by this date only when the question asks when lines were delivered.',
        lineage: { sourceTable: sales, sourceColumn: DeliveryDate }, schemaVersion: 1 }
    - { id: sale.customer_key,  entityId: sale, name: CustomerKey,  dtype: int,       nullable: false, role: foreign_key,
        lineage: { sourceTable: sales, sourceColumn: CustomerKey }, schemaVersion: 1 }
    - { id: sale.store_key,     entityId: sale, name: StoreKey,     dtype: int,       nullable: false, role: foreign_key,
        lineage: { sourceTable: sales, sourceColumn: StoreKey }, schemaVersion: 1 }
    - { id: sale.product_key,   entityId: sale, name: ProductKey,   dtype: int,       nullable: false, role: foreign_key,
        lineage: { sourceTable: sales, sourceColumn: ProductKey }, schemaVersion: 1 }
    - { id: sale.quantity,      entityId: sale, name: Quantity,     dtype: int,       nullable: false, role: attribute, unit: units,
        description: 'Number of items sold in this line. Use the `units_sold` metric for aggregations.',
        lineage: { sourceTable: sales, sourceColumn: Quantity }, schemaVersion: 1 }
    - { id: sale.unit_price,    entityId: sale, name: UnitPrice,    dtype: decimal,   nullable: false, role: attribute, unit: '{native currency}',
        description: 'Gross per-unit list price in the sale row''s CurrencyCode. NetPrice (after discount) is the column to aggregate, not this one.',
        lineage: { sourceTable: sales, sourceColumn: UnitPrice }, schemaVersion: 1 }
    - { id: sale.net_price,     entityId: sale, name: NetPrice,     dtype: decimal,   nullable: false, role: attribute, unit: '{native currency}',
        description: 'Per-unit price AFTER discount in the row''s CurrencyCode. Line revenue (native) = NetPrice * Quantity; for USD divide by ExchangeRate (which is native-per-USD). NEVER sum directly across rows — currencies differ AND the value is per-unit, not per-line. Use the `revenue_usd` metric.',
        lineage: { sourceTable: sales, sourceColumn: NetPrice }, schemaVersion: 1 }
    - { id: sale.unit_cost,     entityId: sale, name: UnitCost,     dtype: decimal,   nullable: false, role: attribute, unit: '{native currency}',
        description: 'Per-unit cost in the row''s CurrencyCode. Like NetPrice, do NOT sum directly. Use the `cogs_usd` metric (= SUM(UnitCost * Quantity / ExchangeRate); ExchangeRate is native-per-USD, so divide).',
        lineage: { sourceTable: sales, sourceColumn: UnitCost }, schemaVersion: 1 }
    - { id: sale.currency_code, entityId: sale, name: CurrencyCode, dtype: string,    nullable: false, role: attribute,
        description: 'ISO-4217 currency the order was transacted in. One of USD / EUR / CAD / GBP / AUD.',
        lineage: { sourceTable: sales, sourceColumn: CurrencyCode }, schemaVersion: 1 }
    - { id: sale.exchange_rate, entityId: sale, name: ExchangeRate, dtype: float,     nullable: false, role: attribute, unit: 'native per USD',
        description: 'Pre-joined FX rate: native-currency units per USD on the order date (medians over the data: GBP 0.79, EUR 0.92, CAD 1.34, AUD 1.49; USD 1.0). DIVIDE a native amount by this to convert to USD: USD = native / ExchangeRate.',
        lineage: { sourceTable: sales, sourceColumn: ExchangeRate }, schemaVersion: 1 }

    # order (6 cols)
    - { id: order.order_key,     entityId: order, name: OrderKey,     dtype: int,    nullable: false, role: primary_key,
        lineage: { sourceTable: orders, sourceColumn: OrderKey }, schemaVersion: 1 }
    - { id: order.customer_key,  entityId: order, name: CustomerKey,  dtype: int,    nullable: false, role: foreign_key,
        lineage: { sourceTable: orders, sourceColumn: CustomerKey }, schemaVersion: 1 }
    - { id: order.store_key,     entityId: order, name: StoreKey,     dtype: int,    nullable: false, role: foreign_key,
        lineage: { sourceTable: orders, sourceColumn: StoreKey }, schemaVersion: 1 }
    - { id: order.order_date,    entityId: order, name: OrderDate,    dtype: date,   nullable: false, role: foreign_key,
        lineage: { sourceTable: orders, sourceColumn: OrderDate }, schemaVersion: 1 }
    - { id: order.delivery_date, entityId: order, name: DeliveryDate, dtype: date,   nullable: true,  role: attribute,
        description: 'The day the order was delivered: the order date or later, never earlier. The share delivered the same day changes a lot from year to year: count it for the period asked.',
        lineage: { sourceTable: orders, sourceColumn: DeliveryDate }, schemaVersion: 1 }
    - { id: order.currency_code, entityId: order, name: CurrencyCode, dtype: string, nullable: false, role: attribute,
        description: 'The currency the order was billed in (AUD, CAD, EUR, GBP or USD); every line of the order shares it. Its amounts are in that currency: revenue_usd converts them.',
        lineage: { sourceTable: orders, sourceColumn: CurrencyCode }, schemaVersion: 1 }

    # customer (12 cols — drop low-signal Vehicle/Company/Birthday/Title/MiddleInitial/GivenName/Surname/StreetAddress/ZipCode/Lat/Long)
    - { id: customer.customer_key, entityId: customer, name: CustomerKey, dtype: int, nullable: false, role: primary_key,
        lineage: { sourceTable: customer, sourceColumn: CustomerKey }, schemaVersion: 1 }
    - { id: customer.geo_area_key, entityId: customer, name: GeoAreaKey, dtype: int, nullable: true, role: attribute,
        description: 'An internal code for the customer''s geographic area (608 values) that no table here names: group by customer.country_full, customer.state or customer.city instead.',
        lineage: { sourceTable: customer, sourceColumn: GeoAreaKey }, schemaVersion: 1 }
    - { id: customer.start_dt,     entityId: customer, name: StartDT,    dtype: date, nullable: false, role: attribute,
        description: 'Start of the customer''s activity period, when they could first place an order.',
        lineage: { sourceTable: customer, sourceColumn: StartDT }, schemaVersion: 1 }
    - { id: customer.end_dt,       entityId: customer, name: EndDT,      dtype: date, nullable: false, role: attribute,
        description: 'End of the customer''s activity period. An EndDT after the data''s as-of date means the period is still open.',
        lineage: { sourceTable: customer, sourceColumn: EndDT }, schemaVersion: 1 }
    - { id: customer.continent,    entityId: customer, name: Continent,   dtype: string, nullable: false, role: attribute,
        description: 'One of three: Australia, Europe, North America. Highest level of the customer geography hierarchy.',
        lineage: { sourceTable: customer, sourceColumn: Continent }, schemaVersion: 1 }
    - { id: customer.country,      entityId: customer, name: Country,     dtype: string, nullable: false, role: attribute,
        description: 'Two-letter country code (ISO 3166-1 alpha-2).',
        lineage: { sourceTable: customer, sourceColumn: Country }, schemaVersion: 1 }
    - { id: customer.country_full, entityId: customer, name: CountryFull, dtype: string, nullable: false, role: attribute,
        description: 'Full country name. Prefer this over the two-letter code for display.',
        lineage: { sourceTable: customer, sourceColumn: CountryFull }, schemaVersion: 1 }
    - { id: customer.state,        entityId: customer, name: State,       dtype: string, nullable: true,  role: attribute,
        description: 'The state, province or region of the customer''s address as the source writes it: a short code in most countries (NJ, QC, QLD), an area name in the United Kingdom. 565 values, and 40 codes recur in several countries (WA is Washington and Western Australia): group it with customer.country_full.',
        lineage: { sourceTable: customer, sourceColumn: State }, schemaVersion: 1 }
    - { id: customer.city,         entityId: customer, name: City,        dtype: string, nullable: true,  role: attribute,
        description: 'The city of the customer''s address as written (34,581 values). A city name can recur in several states: group it with customer.state.',
        lineage: { sourceTable: customer, sourceColumn: City }, schemaVersion: 1 }
    - { id: customer.age,          entityId: customer, name: Age,         dtype: int,    nullable: true,  role: attribute, unit: years,
        description: 'The customer''s age in years (19 to 85), one fixed value per customer: not their age at each sale.',
        lineage: { sourceTable: customer, sourceColumn: Age }, schemaVersion: 1 }
    - { id: customer.occupation,   entityId: customer, name: Occupation,  dtype: string, nullable: true,  role: attribute,
        description: 'The customer''s job title as free text (2,571 values, some misspelled): too varied to group by for most questions.',
        lineage: { sourceTable: customer, sourceColumn: Occupation }, schemaVersion: 1 }
    - { id: customer.gender,       entityId: customer, name: Gender,      dtype: string, nullable: true,  role: attribute,
        description: 'The customer''s gender, written in lowercase: ''female'' or ''male''.',
        lineage: { sourceTable: customer, sourceColumn: Gender }, schemaVersion: 1 }

    # product (14 cols)
    - { id: product.product_key,   entityId: product, name: ProductKey,   dtype: int,     nullable: false, role: primary_key,
        lineage: { sourceTable: product, sourceColumn: ProductKey }, schemaVersion: 1 }
    - { id: product.product_code,  entityId: product, name: ProductCode,  dtype: string,  nullable: false, role: attribute,
        description: 'The product''s seven-digit code, one per product. Its first four digits are its subcategory key, zero-padded: 0305074 is in subcategory 305. The glossary says how it is written and said.',
        lineage: { sourceTable: product, sourceColumn: ProductCode }, schemaVersion: 1 }
    - { id: product.product_name,  entityId: product, name: ProductName,  dtype: string,  nullable: false, role: attribute,
        description: 'Human-readable product name. Most specific level of the product hierarchy.',
        lineage: { sourceTable: product, sourceColumn: ProductName }, schemaVersion: 1 }
    - { id: product.brand,         entityId: product, name: Brand,        dtype: string,  nullable: false, role: attribute,
        description: 'Product brand. 11 brands total; Contoso''s own-brand SKUs account for ~28% of the catalogue.',
        lineage: { sourceTable: product, sourceColumn: Brand }, schemaVersion: 1 }
    - { id: product.manufacturer,  entityId: product, name: Manufacturer, dtype: string,  nullable: false, role: attribute,
        description: 'The company that makes the product (11 values, such as "Proseware, Inc."). Each has one brand, product.brand, under the same name or a shorter one ("Proseware").',
        lineage: { sourceTable: product, sourceColumn: Manufacturer }, schemaVersion: 1 }
    - { id: product.color,         entityId: product, name: Color,        dtype: string,  nullable: true,  role: attribute,
        description: 'The product''s colour (17 values). Both "Blue" and "blue" occur: compare it case-insensitively.',
        lineage: { sourceTable: product, sourceColumn: Color }, schemaVersion: 1 }
    - { id: product.weight,        entityId: product, name: Weight,       dtype: float,   nullable: true,  role: attribute,
        description: 'The product''s weight in the unit product.weight_unit names (grams, ounces or pounds): convert to one unit before adding or comparing weights (1 pound = 16 ounces = 453.59 grams). NULL for 284 products.',
        lineage: { sourceTable: product, sourceColumn: Weight }, schemaVersion: 1 }
    - { id: product.weight_unit,   entityId: product, name: WeightUnit,   dtype: string,  nullable: true,  role: attribute,
        description: 'The unit of product.weight: grams, ounces or pounds. NULL for 222 products, which have no weight either.',
        lineage: { sourceTable: product, sourceColumn: WeightUnit }, schemaVersion: 1 }
    - { id: product.cost,          entityId: product, name: Cost,         dtype: decimal, nullable: false, role: attribute, unit: USD,
        description: 'The product''s current list unit cost in USD. A sale''s unit_cost is the cost when it was sold, in that sale''s currency, and usually differs from this figure converted: for anything sold, use the sale''s unit_cost or the cogs_usd metric.',
        lineage: { sourceTable: product, sourceColumn: Cost }, schemaVersion: 1 }
    - { id: product.price,         entityId: product, name: Price,        dtype: decimal, nullable: false, role: attribute, unit: USD,
        description: 'The product''s current list unit price in USD. A sale''s unit_price is the list price when it was sold, in that sale''s currency, and usually differs from this figure converted: for anything sold, use the sale''s prices or the revenue_usd metric.',
        lineage: { sourceTable: product, sourceColumn: Price }, schemaVersion: 1 }
    - { id: product.category_key,  entityId: product, name: CategoryKey,  dtype: int,     nullable: false, role: attribute,
        description: 'The category''s number, 1 to 8. product.category_name is its name: group and filter by the name.',
        lineage: { sourceTable: product, sourceColumn: CategoryKey }, schemaVersion: 1 }
    - { id: product.category_name, entityId: product, name: CategoryName, dtype: string,  nullable: false, role: attribute,
        description: 'Top-level product category, one of 8: Audio; Cameras and camcorders; Cell phones; Computers; Games and Toys; Home Appliances; Music, Movies and Audio Books; TV and Video.',
        synonyms: [department],
        lineage: { sourceTable: product, sourceColumn: CategoryName }, schemaVersion: 1 }
    - { id: product.subcategory_key,  entityId: product, name: SubCategoryKey,  dtype: int,    nullable: false, role: attribute,
        description: 'The subcategory''s number: its category''s number times 100, plus a number from 1 to 8 (305 is in category 3). product.subcategory_name is its name.',
        lineage: { sourceTable: product, sourceColumn: SubCategoryKey }, schemaVersion: 1 }
    - { id: product.subcategory_name, entityId: product, name: SubCategoryName, dtype: string, nullable: false, role: attribute,
        description: 'The product''s subcategory (32 values, such as "Camcorders"), each within one category.',
        lineage: { sourceTable: product, sourceColumn: SubCategoryName }, schemaVersion: 1 }

    # store (10 cols)
    - { id: store.store_key,      entityId: store, name: StoreKey,      dtype: int,     nullable: false, role: primary_key,
        lineage: { sourceTable: store, sourceColumn: StoreKey }, schemaVersion: 1 }
    - { id: store.store_code,     entityId: store, name: StoreCode,     dtype: string,  nullable: false, role: attribute,
        description: 'Short numeric store code. The Online virtual store has StoreCode=-1; physical stores have positive numeric codes. Prefer the `store.channel` dim over decoding StoreCode for online-vs-physical splits. A restructured store keeps its code and its name under a new StoreKey, so one code or name can stand for more than one store row (74 stores, 67 codes).',
        lineage: { sourceTable: store, sourceColumn: StoreCode }, schemaVersion: 1 }
    - { id: store.country_code,   entityId: store, name: CountryCode,   dtype: string,  nullable: false, role: attribute,
        description: 'The two-letter code of the store''s country (US, CA, GB); "--" for the Online store.',
        lineage: { sourceTable: store, sourceColumn: CountryCode }, schemaVersion: 1 }
    - { id: store.country_name,   entityId: store, name: CountryName,   dtype: string,  nullable: false, role: attribute,
        description: 'Country the store sits in, 9 values. One is "Online": the virtual store of every online sale, a channel and not a country, so name it as the online channel or leave it out with store.channel. A "which country" question means where customers are (customer.country_full) unless it asks about the stores.',
        lineage: { sourceTable: store, sourceColumn: CountryName }, schemaVersion: 1 }
    - { id: store.channel,        entityId: store, name: Channel,       dtype: string,  nullable: false, role: attribute,
        description: 'Sales-channel flag: "Online" for the virtual store, "In-store" for every physical location. Use this dim for online-vs-physical revenue / units / margin splits.',
        lineage: { sourceTable: store, sourceColumn: Channel }, schemaVersion: 1 }
    - { id: store.state,          entityId: store, name: State,         dtype: string,  nullable: true,  role: attribute,
        description: 'The state, province or region the store is in (67 values); "Online" for the Online store.',
        lineage: { sourceTable: store, sourceColumn: State }, schemaVersion: 1 }
    - { id: store.open_date,      entityId: store, name: OpenDate,      dtype: date,    nullable: false, role: attribute,
        description: 'The day the store opened (2005-03-04 to 2019-03-05): an attribute of the store, not a time axis for its sales.',
        lineage: { sourceTable: store, sourceColumn: OpenDate }, schemaVersion: 1 }
    - { id: store.close_date,     entityId: store, name: CloseDate,     dtype: date,    nullable: true,  role: attribute,
        description: 'NULL means the store is still open. A non-NULL CloseDate means the store closed on that date.',
        lineage: { sourceTable: store, sourceColumn: CloseDate }, schemaVersion: 1 }
    - { id: store.status,         entityId: store, name: Status,        dtype: string,  nullable: true,  role: attribute,
        description: 'Why a store row stopped trading: ''Closed'' (8 stores) or ''Restructured'' (7, each reopened under a new StoreKey with the same code). NULL for every other store, the Online store included, though StoreKey 630 closed in 2019 without a status. For current stores test CloseDate IS NULL, never Status != ''Closed'', which drops every NULL.',
        lineage: { sourceTable: store, sourceColumn: Status }, schemaVersion: 1 }
    - { id: store.square_meters,  entityId: store, name: SquareMeters,  dtype: int,     nullable: true,  role: attribute, unit: 'square metres',
        description: 'The store''s floor area in square meters (245 to 3,500). NULL for the Online store.',
        lineage: { sourceTable: store, sourceColumn: SquareMeters }, schemaVersion: 1 }
    - { id: store.description,    entityId: store, name: Description,   dtype: string,  nullable: true,  role: attribute,
        description: 'The store''s name ("Contoso Store <place>", "Online store"). A restructured store keeps its name under a new StoreKey, so one name can stand for more than one store row.',
        lineage: { sourceTable: store, sourceColumn: Description }, schemaVersion: 1 }

    # date (10 cols — calendar)
    - { id: date.date,            entityId: date, name: Date,         dtype: date,   nullable: false, role: primary_key,
        lineage: { sourceTable: date, sourceColumn: Date }, schemaVersion: 1 }
    - { id: date.date_key,        entityId: date, name: DateKey,      dtype: int,    nullable: false, role: attribute,
        description: 'The day as a YYYYMMDD number (20160101 to 20261231), one per day. Filter and sort by date.date instead.',
        lineage: { sourceTable: date, sourceColumn: DateKey }, schemaVersion: 1 }
    - { id: date.year,            entityId: date, name: Year,         dtype: int,    nullable: false, role: attribute, unit: year,
        description: 'Calendar year (2016–2026 in the data).',
        lineage: { sourceTable: date, sourceColumn: Year }, schemaVersion: 1 }
    - { id: date.quarter,         entityId: date, name: Quarter,      dtype: string, nullable: false, role: attribute,
        description: 'The calendar quarter without its year, "Q1" to "Q4": group it with date.year, or use date.calendar_quarter for a quarter of one year.',
        lineage: { sourceTable: date, sourceColumn: Quarter }, schemaVersion: 1 }
    - { id: date.year_quarter,    entityId: date, name: YearQuarter,  dtype: string, nullable: false, role: attribute,
        description: 'Year-and-quarter as a single label, e.g. "Q3-2024". Use for time-series sorted by quarter.',
        lineage: { sourceTable: date, sourceColumn: YearQuarter }, schemaVersion: 1 }
    - { id: date.year_month,      entityId: date, name: YearMonth,    dtype: string, nullable: false, role: attribute,
        description: 'Year-and-month label, e.g. "July 2024". Canonical monthly grain.',
        lineage: { sourceTable: date, sourceColumn: YearMonth }, schemaVersion: 1 }
    - { id: date.month,           entityId: date, name: Month,        dtype: string, nullable: false, role: attribute,
        description: 'The month name without its year, "January" to "December": sort by date.month_number, and use date.year_month for a month of one year.',
        lineage: { sourceTable: date, sourceColumn: Month }, schemaVersion: 1 }
    - { id: date.month_number,    entityId: date, name: MonthNumber,  dtype: int,    nullable: false, role: attribute,
        description: 'The month as a number, 1 to 12, to sort month names; it carries no year.',
        lineage: { sourceTable: date, sourceColumn: MonthNumber }, schemaVersion: 1 }
    - { id: date.day_of_week,     entityId: date, name: DayofWeek,    dtype: string, nullable: false, role: attribute,
        description: 'The weekday name, "Monday" to "Sunday".',
        lineage: { sourceTable: date, sourceColumn: DayofWeek }, schemaVersion: 1 }
    - { id: date.working_day,     entityId: date, name: WorkingDay,   dtype: int,    nullable: false, role: attribute,
        description: '1 for a working day and 0 for any other day (a number, not Y/N). About 69% of days are working days.',
        lineage: { sourceTable: date, sourceColumn: WorkingDay }, schemaVersion: 1 }

    # currency_rate (4 cols)
    - { id: currency_rate.date,           entityId: currency_rate, name: Date,         dtype: date,  nullable: false, role: primary_key,
        lineage: { sourceTable: currencyexchange, sourceColumn: Date }, schemaVersion: 1 }
    - { id: currency_rate.from_currency,  entityId: currency_rate, name: FromCurrency, dtype: string, nullable: false, role: primary_key,
        lineage: { sourceTable: currencyexchange, sourceColumn: FromCurrency }, schemaVersion: 1 }
    - { id: currency_rate.to_currency,    entityId: currency_rate, name: ToCurrency,   dtype: string, nullable: false, role: primary_key,
        lineage: { sourceTable: currencyexchange, sourceColumn: ToCurrency }, schemaVersion: 1 }
    - { id: currency_rate.exchange,       entityId: currency_rate, name: Exchange,     dtype: float,  nullable: false, role: attribute, unit: 'to per from',
        description: 'Multiply a FromCurrency amount by this to convert to ToCurrency on the given Date. Self-pairs (USD→USD) are 1.0.',
        lineage: { sourceTable: currencyexchange, sourceColumn: Exchange }, schemaVersion: 1 }

  relationships:
    - { id: sale_to_customer,    name: 'Sale → Customer', inverseName: 'Customer ← Sale',  fromEntityId: sale,     toEntityId: customer,      cardinality: 'N:1', category: structural,
        joinFromProperty: sale.customer_key, joinToProperty: customer.customer_key, schemaVersion: 1 }
